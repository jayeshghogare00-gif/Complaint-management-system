{% extends "base.html" %}
{% block title %}Login · College CMS{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
  <div class="glass rounded-3xl p-7 w-full max-w-md shadow-2xl">
    <div class="text-center mb-7">
      <div class="text-4xl mb-3">🎓</div>
      <h1 class="text-2xl font-black">College CMS</h1>
      <p class="text-slate-400 mt-1">Sign in to manage grievances</p>
    </div>
    <form method="post" class="space-y-4">
      <div><label class="block text-sm mb-2">Email or login address</label><input class="input" type="text" inputmode="email" name="email" autocomplete="username" required></div>
      <div><label class="block text-sm mb-2">Password</label><input class="input" type="password" name="password" required></div>
      <button class="btn btn-primary w-full">Login</button>
    </form>
    <p class="text-center text-sm text-slate-400 mt-5">New student?
      <a class="text-indigo-400 font-bold" href="{{ url_for('register') }}">Create account</a>
    </p>
  </div>
</div>
{% endblock %}
