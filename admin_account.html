{% extends "base.html" %}
{% block title %}Admin Account · College CMS{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <a href="{{ url_for('admin_dashboard') }}" class="text-indigo-400 text-sm">← Back to dashboard</a>
  <section class="glass rounded-2xl p-6 mt-4">
    <p class="text-indigo-400 font-bold text-sm">ADMIN ACCOUNT</p>
    <h1 class="text-2xl font-black mt-1">Change email and password</h1>
    <form method="post" class="space-y-4 mt-6">
      <div>
        <label class="block text-sm mb-2" for="email">New email or login address</label>
        <input class="input" id="email" type="text" inputmode="email" name="email" value="{{ admin.email }}" autocomplete="username" required>
      </div>
      <div>
        <label class="block text-sm mb-2" for="current_password">Current password</label>
        <input class="input" id="current_password" type="password" name="current_password" autocomplete="current-password" required>
      </div>
      <div>
        <label class="block text-sm mb-2" for="password">New password</label>
        <input class="input" id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div>
        <label class="block text-sm mb-2" for="confirm_password">Confirm new password</label>
        <input class="input" id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-full">Update account</button>
    </form>
  </section>
</div>
{% endblock %}
