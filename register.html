{% extends "base.html" %}
{% block title %}Register · College CMS{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
  <div class="glass rounded-3xl p-7 w-full max-w-lg">
    <h1 class="text-2xl font-black mb-1">Create Student Account</h1>
    <p class="text-slate-400 mb-6">Use your college details.</p>
    <form method="post" class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2"><label class="block text-sm mb-2">Full name</label><input class="input" name="name" required maxlength="100"></div>
      <div><label class="block text-sm mb-2">Email</label><input class="input" type="email" name="email" required></div>
      <div><label class="block text-sm mb-2">Roll number</label><input class="input" name="roll_number" required maxlength="30"></div>
      <div class="sm:col-span-2"><label class="block text-sm mb-2">Department</label><input class="input" name="department" required maxlength="100"></div>
      <div class="sm:col-span-2"><label class="block text-sm mb-2">Password</label><input class="input" type="password" name="password" minlength="6" required></div>
      <button class="btn btn-primary sm:col-span-2">Create Account</button>
    </form>
    <p class="text-center text-sm text-slate-400 mt-5"><a class="text-indigo-400" href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
