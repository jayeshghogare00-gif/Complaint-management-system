<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}College CMS{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Main theme colors: change these variables to customize the whole application. */
    :root { --accent:#6366f1; --bg:#0b1020; --card:#111827; }
    body { background:var(--bg); color:#e5e7eb; }
    .glass { background:rgba(17,24,39,.82); border:1px solid rgba(148,163,184,.14); backdrop-filter:blur(12px); }
    .input { width:100%; border-radius:.75rem; background:#0b1220; border:1px solid #273449; padding:.75rem .9rem; outline:none; }
    .input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .btn { border-radius:.75rem; padding:.7rem 1rem; font-weight:700; transition:.2s; }
    .btn-primary { background:var(--accent); color:white; }
    .btn-primary:hover { filter:brightness(1.1); }
    .btn-danger { background:#991b1b; color:white; }
    .badge { display:inline-flex; align-items:center; border-radius:999px; padding:.25rem .65rem; font-size:.75rem; font-weight:800; }
  </style>
</head>
<body class="min-h-screen">
<nav class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="{{ url_for('index') }}" class="font-black text-lg">🎓 College CMS</a>
    {% if current_user %}
    <div class="flex items-center gap-2">
      <span class="hidden sm:block text-sm text-slate-400">{{ current_user.name }}</span>
      <a href="{{ url_for('logout') }}" class="btn bg-slate-800 text-slate-200">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="space-y-2 mb-5">
      {% for category, message in messages %}
        <div class="rounded-xl px-4 py-3 {{ 'bg-emerald-950 text-emerald-200 border border-emerald-800' if category == 'success' else 'bg-red-950 text-red-200 border border-red-800' }}">
          {{ message }}
        </div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
